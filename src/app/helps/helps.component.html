<section class="py-3">

    <div class="container">
        <table class="table">
            <thead>
                <tr>
                    <th>Categoria</th>
                    <th>Titolo</th>
                    <th>Descrizione</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let h of helps">
                    <td>{{ h.category }}</td>
                    <td>{{ h.title }}</td>
                    <td>{{ h.description }}</td>
                    <td width="250">
                        <button type="button" class="btn btn-danger mr-1"
                            (click)="deleteHelps(h.id, i)">Cancella</button>
                        <a [routerLink]="['/helps/edit/', h.id]">
                            <button type="button" class="btn btn-primary">Modifica</button>
                        </a>
                    </td>
                </tr>
            </tbody>
            <a class="text-center" [routerLink]="['/helps/add']">
                <button type="button" class="btn btn-primary">Aggiungi</button>
            </a>
        </table>
    </div>


</section>
