<section class="py-3">

    <div class="container">

        <div class="text-right">
            <a *ngIf="likeHelpController()" [routerLink]="['/helps/add']" class="btn btn-outline-primary mb-3">
                <fa-icon [icon]="['fas', 'plus']"></fa-icon> Nuova richiesta di aiuto
            </a>
        </div>

        <p *ngIf="helps.length == 0">Non ci sono richieste di aiuto.</p>
        <table class="table" *ngIf="helps.length > 0">
            <thead>
                <tr>
                    <th>Richiesta di aiuto</th>
                    <th>Posizione</th>
                    <th>Creata</th>
                    <th>Autore</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let h of helps">
                    <td>
                        <a [routerLink]="['/helps/', h.id]">
                            <img class="help-img" src="{{ h.image == null ? 'assets/img/placeholder-help.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + h.image }}" alt="{{ h.title }} image" width="100">
                        </a>
                        <div class="help-desc">
                            <app-categories [category]="h.category"></app-categories>
                            <p>
                                <a [routerLink]="['/helps/', h.id]" class="text-dark">
                                {{ h.title }}
                              </a>
                            </p>
                        </div>
                    </td>
                    <td class="col-location">
                        <fa-icon [icon]="['fas', 'map-marker-alt']"></fa-icon>
                        {{ h.address }}
                    </td>
                    <td>
                        {{ h.createdAt | date: "dd/MM/yyyy" }}
                    </td>
                    <td>
                        <app-user-icon [user]="h.creator"></app-user-icon>
                    </td>
                    <td>
                        <a [routerLink]="['/helps/', h.id]" class="btn btn-outline-secondary btn-block">
                        Visualizza
                      </a>
                        <a [routerLink]="['/helps/', h.id, 'response']" class="btn btn-outline-primary btn-block">
                        Aiuta
                      </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
