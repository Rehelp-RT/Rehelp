<h3>Modifica dati personali</h3>

<hr>

<form *ngIf="model" #helpForm="ngForm" (ngSubmit)="onSubmit()">

    <div class="form-row mb-3">
        <label class="col-md-4" for="firstname">Nome</label>
        <input class="col-md-8 form-control" type="text" [(ngModel)]="model.firstname" name="firstname" required />
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="lastname">Cognome</label>
        <input class="col-md-8 form-control" type="text" [(ngModel)]="model.lastname" name="lastname" required />
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="inlineRadioOptions"></label>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" [(ngModel)]="model.donator"  name="inlineRadioOptions"
                id="inlineRadio1" [value]="true">
            <label class="form-check-label" for="inlineRadio1">Donatore</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" [(ngModel)]="model.donator"  name="inlineRadioOptions"
                id="inlineRadio2" [value]="false">
            <label class="form-check-label" for="inlineRadio2">Non donatore</label>
        </div>
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="description">Breve descrizione di sé</label>
        <textarea class="col-md-8 form-control" rows="4" type="text" [(ngModel)]="model.description" name="description"
            placeholder="Sono appassionato di...">
        </textarea>
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="lastname">Data di nascita</label>
        <input class="col-md-8 form-control" type="date" [(ngModel)]="model.birthdate" name="birthdate" />
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="email">Email</label>
        <input class="col-md-8 form-control" type="text" [(ngModel)]="model.email" name="email" required />
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="phoneNumber">Cellulare</label>
        <input class="col-md-8 form-control" type="text" [(ngModel)]="model.phoneNumber" name="phoneNumber" required />
    </div>

    

    <div class="form-row mb-3">
        <label class="col-md-4" for="location">Zona</label>
        <google-map class="col-md-8" [center]="{lat: model.latitude, lng: model.longitude}" [zoom]="zoom" width="100%" height="400px">
            <map-marker [position]="{lat: model.latitude, lng: model.longitude}" [options]="{draggable: true}" (mapDragend)="markerDragEnd($event)">
            </map-marker>
        </google-map>
    </div>

    <div class="form-row mb-3">
        <label class="col-md-4" for="address">Indirizzo</label>
        <input type="text" class="col-md-8 form-control" [(ngModel)]="address" name="address"
            (keydown.enter)="$event.preventDefault()" placeholder="{{address}}" value="{{address}}" autocorrect="off"
            autocapitalize="off" spellcheck="off" type="text" #search>
    </div>

    <div class="form-row mb-3">
        <div class="offset-md-4 col-md-4 mb-1">
            <a class="btn btn-block btn-outline-secondary" [routerLink]="['/profile', model.id ]">Annulla</a>
        </div>
        <button class="btn btn-outline-primary col-md-4 mb-3" type="submit">
            <fa-icon [icon]="['fas', 'save']"></fa-icon> Salva
        </button>
    </div>
</form>
