<section class="py-3">

    <div class="container">
        <h4 class="display-4">Meet & Help</h4>
        <div class="text-right">
            <a [routerLink]="['/helps/add']" class="btn btn-outline-primary mb-3">
                <fa-icon [icon]="['fas', 'plus']"></fa-icon> Aggiungi
            </a>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Img</th>
                    <th>Titolo</th>
                    <th>Categoria</th>
                    <th>Autore</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let h of helps">
                    <td>
                        <img src="{{ h.image == null ? 'assets/img/placeholder-help.png' : 'http://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + h.image }}" alt="{{ h.title }} image" width="100" class="help-img">
                    </td>
                    <td>{{ h.title }}</td>
                    <td>{{ h.category.name }}</td>
                    <td>
                        <span class="img-avatar rounded-circle">
                          <img src="{{ h.creator.avatar == null ? 'assets/img/avatar_64.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + h.creator.avatar }}" alt="{{ h.creator.firstname + ' ' + h.creator.lastname }}" title="{{ h.creator.firstname + ' ' + h.creator.lastname }}" width="32">
                        </span>
                    </td>
                    <td>
                        <a [routerLink]="['/helps/', h.id]" class="btn btn-sm btn-outline-secondary m-1">
                            Dettagli
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
