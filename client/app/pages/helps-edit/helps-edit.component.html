<div class="container py-3">
    <div class="row">

        <div class="col-lg-2 col-md-3 mb-3">
            <a *ngIf="model" class="btn btn-block btn-outline-secondary" [routerLink]="['/helps/', model.id]">
                <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon> Richiesta
            </a>
        </div>

        <div class="col-lg-10 col-md-9">

            <h2 class="display-4">Modifica Help</h2>
            <div class="card mt-3">
                <div class="card-body">
                    <form *ngIf="model" #helpForm="ngForm" (ngSubmit)="onSubmit()">

                        <div class="form-row mb-3">
                            <label class="col-lg-4" for="category">Categoria</label>
                            <div class="col-lg-8">
                                <select class="form-control mb-3" [(ngModel)]="idCat1" name="idCat1" required>
                              <option *ngFor="let cat of categories" [value]="cat.id">
                                  {{ cat.name }}
                              </option>
                          </select>
                                <select *ngIf="idCat1 != null" class="form-control mb-3" [(ngModel)]="idCat2" name="idCat2" required>
                              <option *ngFor="let cat of categories | filterCategories : { id: idCat1 }" [value]="cat.id">
                                  {{ cat.name }}
                              </option>
                          </select>
                                <select *ngIf="idCat2 != null && (categories | filterCategories : { id: idCat1, idChild: idCat2 }).length > 0" class="form-control mb-3" [(ngModel)]="idCat3" name="idCat3">
                              <option *ngFor="let cat of categories | filterCategories : { id: idCat1, idChild: idCat2 }" [value]="cat.id">
                                  {{ cat.name }}
                              </option>
                          </select>
                            </div>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-lg-4" for="title">Titolo</label>
                            <input class="col-lg-8 form-control" type="text" [(ngModel)]="model.title" name="title" required />
                        </div>

                        <div class="row mb-3">
                            <label class="col-lg-4" for="category">immagine</label>
                            <div class="col-lg-8" [hidden]="imageUploaded">
                                <p>{{ idCat1 }} - {{ idCat2 }} - {{ idCat3 }}</p>
                                <img src="{{ model.image == null ? 'assets/img/placeholder-help.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + model.image }}" alt="{{ model.title }} image" width="100%" class="help-img">
                            </div>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-lg-4" for="image">Sostituisci immagine
                                <sub style="color:grey;">
                                    <p>Trascina sul riquadro la foto da caricare</p>
                                </sub>
                            </label>
                            <div [hidden]="imageUploaded">
                                <form id="direct_upload" ng2FileDrop [uploader]="uploader" (fileOver)="fileOverBase($event)" [ngClass]="{ 'nv-file-over': hasBaseDropZoneOver }">
                                    <div class="py-3">
                                        <div class="form_controls">
                                            <div class="upload_button_holder">
                                                <label class="btn btn-outline-secondary" for="fileupload">
                                                  <fa-icon [icon]="['fas', 'cloud-upload-alt']"></fa-icon> Sfoglia
                                              </label>
                                                <!-- onChange hanlder resets the input value to get the change event when uploading the same file consecutively -->
                                                <input type="file" id="fileupload" #fileInput ng2FileSelect [style.display]="'none'" [uploader]="uploader" (change)="fileInput.value = ''" multiple />
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <div class="file" *ngFor="let response of responses; let i = index; last as isLast">
                                <div *ngIf="imageUploaded && isLast">
                                    <div class="status">
                                        Caricamento... {{ response.progress }}%
                                        <div *ngIf="!response.status">In progress</div>
                                        <div class="status-code" *ngIf="response.status==200">
                                            Caricamento completo
                                        </div>
                                        <input type="hidden" [(ngModel)]="model.image" [value]="response.data.public_id " name="image" />
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress" role="progressbar" [style.width.%]="response.progress"></div>
                                    </div>
                                    <a target="_blank" href="{{ response.data.url}}">
                                        <img src="{{ response.data.url}}" alt="{{ response.data.public_id }}">
                                    </a>
                                    <a (click)="toggleImgUploader()" class="btn btn-danger btn-block col-md-1 mt-2">
                                        <fa-icon [icon]="['fas', 'trash-alt']"></fa-icon>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-lg-4" for="description">Descrizione</label>
                            <textarea class="col-lg-8 form-control" rows="4" [(ngModel)]="model.description" name="description" required>
                        </textarea>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-lg-4" for="location">Zona</label>
                            <agm-map class="col-lg-8" [latitude]="model.latitude" [longitude]="model.longitude" [zoom]="zoom">
                                <agm-marker [latitude]="model.latitude" [longitude]="model.longitude" [markerDraggable]="true" (dragEnd)="markerDragEnd($event)">
                                </agm-marker>
                            </agm-map>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-lg-4" for="address">Indirizzo</label>
                            <input class="col-lg-8 form-control" type="text" [(ngModel)]="model.address" name="address" (keydown.enter)="$event.preventDefault()" placeholder="{{address}}" value="{{address}}" autocorrect="off" autocapitalize="off" spellcheck="off" type="text" #search>
                        </div>

                        <div class="form-row mb-3">
                            <button class="btn btn-outline-primary offset-lg-4 col-lg-8 mb-3" type="submit">
                                <fa-icon [icon]="['fas', 'save']"></fa-icon> Salva
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
