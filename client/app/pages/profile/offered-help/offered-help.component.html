<h3 class="mb-3">Offerte di aiuto</h3>

<div *ngIf="responses.length > 0">
    <table class="table">
        <tbody>
            <tr *ngFor="let r of responses">
                <td>
                    <img src="{{ r.help.image != null ? 'https://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + r.help.image : (r.help.category.image != null ? 'assets/img/categories/' + r.help.category.image : 'assets/img/placeholder-help.png')  }}"
                    alt="{{ r.help.title }} image" class="help-img" width="100">
                </td>
                <td>
                    <app-categories [category]="r.help.category"></app-categories>
                    {{ r.help.title }}
                </td>
                <td>
                    {{ r.help.type?.name }}
                </td>
                <td>
                    <a [routerLink]="['/helps/', r.help.id]" class="btn btn-sm btn-outline-secondary m-1">
                        Dettagli
                    </a>
                </td>
                <td>
                    <div *ngIf="!r.help.accepted">
                        <fa-icon title="In attesa di accettazione" [icon]="['fas', 'clock']"></fa-icon>
                    </div>
                    <div *ngIf="r.help.accepted && !r.help.reviewed">
                        <fa-icon title="Accettato" [icon]="['fas', 'check']"></fa-icon>
                    </div>
                    <div *ngIf="r.help.reviewed && !r.help.completed">
                        <fa-icon title="Recensito" [icon]="['fas', 'star']" class="text-warning mr-2"></fa-icon>
                    </div>
                    <div *ngIf="r.help.completed">
                        <fa-icon title="Completato" [icon]="['fas', 'star-of-life']" class="text-info"></fa-icon>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div *ngIf="responses.length == 0">
    <hr>
    <p>Nessuna risposta di aiuto trovata.</p>
</div>
