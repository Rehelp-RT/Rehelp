<div class="accordion">
    <div class="contentBx" [class.active]="check">
        <div class="label" (click)="open()">comment</div>
        <div class="content">
            <div class="container">
                <div class="body">
                    <div class="message">
                        <p>USer</p>
                        <p >Hello</p>
                    </div>
                    <div class="message user_message" *ngFor="let comment of postComment">
                        <p>io</p>
                        <p >{{comment}}</p>
                    </div>
                    
                </div>
                <div class="footer">
                    <form action="">
                        <input [(ngModel)]="comment" type="text" placeholder="Type your messages here...">
                        <button (click)="post()">SEND</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
