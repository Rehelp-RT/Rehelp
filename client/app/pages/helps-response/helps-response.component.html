<div class="container py-3">
    <div class="row" *ngIf="response">
        <div class="col-lg-2 col-md-3 mb-3">
            <a class="btn btn-block btn-outline-secondary" [routerLink]="['/helps/' + response.help.id ]">
                <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon> Richiesta
            </a>
        </div>

        <div class="col-lg-10 col-md-9">
            <h2 class="display-4">Offri il tuo aiuto</h2>
            <div class="card my-3">
                <div class="card-body">
                    <form #helpForm="ngForm" (ngSubmit)="onSubmit()">
                        <input type="hidden" [(ngModel)]="response.help.id" name="idHelp" />

                        <div class="row mb-3">
                            <div class="col-4">Categoria</div>
                            <div class="col-8">
                              <app-categories [category]="response.help.category"></app-categories>
                            </div>
                        </div>

                          <div class="form-row mb-3" *ngIf="response.help.type?.code == 'MES'">
                            <label class="col-lg-4" for="tradeTypes">Tipo</label>
                            <div class="col-lg-8">
                                <select
                                    class="form-control mb-3"
                                    [(ngModel)]="response.idTradeType"
                                    [ngModelOptions]="{standalone: true}">
                                    <option *ngFor="let trd of tradeTypes" [value]="trd.id">
                                        {{ trd.name }}
                                    </option>
                                </select>
                            </div>
                          </div>

                        <!-- <div class="form-row mb-3">
                            <label class="col-md-4">Richiesta</label>
                            <div class="col-md-8">
                                {{ response.help.title }}
                            </div>
                        </div> -->

                        <div class="form-row mb-3">
                            <label class="col-md-4">Descrizione</label>
                            <div class="col-md-8">
                                {{ response.help.description }}
                            </div>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-md-4">Creatore</label>
                            <div class="col-md-8">
                                <app-user-icon [user]="response.help.creator"></app-user-icon>
                            </div>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-md-4">Data creazione</label>
                            <div class="col-md-8">
                                {{ response.help.createdAt | date: "dd/MM/yyyy" }}
                            </div>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-md-4" for="description">Messaggio (opzionale)</label>
                            <textarea class="col-md-8 form-control" rows="4" [(ngModel)]="response.message" name="message" required></textarea>
                        </div>

                        <div class="form-row mb-3">
                            <button class="btn btn-outline-primary offset-md-4 col-md-8 mb-3" type="submit">
                              <fa-icon [icon]="['fas', 'plus']"></fa-icon> Rispondi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
