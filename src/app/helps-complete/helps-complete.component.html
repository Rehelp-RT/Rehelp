<div class="container py-3">
    <div class="row">
        <div class="col-lg-2 col-md-3 mb-3">
            <a class="btn btn-block btn-outline-secondary" [routerLink]="['/helps/', model.id]">
                <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon> Richiesta
            </a>
        </div>
        <div class="col-lg-10 col-md-9">
            <h2 class="display-4">Completa Help</h2>
            <div class="card mt-3">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <img src="{{ model.image == null ? 'assets/img/placeholder-help.png' : 'http://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + model.image }}" alt="{{ model.title }} image" class="img-fluid mb-3">
                            <agm-map class="col-md-9" [latitude]="model.latitude" [longitude]="model.longitude">
                                <agm-marker [latitude]="model.latitude" [longitude]="model.longitude">
                                </agm-marker>
                            </agm-map>
                        </div>
                        <div class="col-md-6">
                            <div class="row mb-3">
                                <div class="col-md-4"><strong>Tipo</strong></div>
                                <div class="col-md-8">{{ model?.type?.name }}</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4"><strong>Categoria</strong></div>
                                <div class="col-md-8">{{ model.category?.name }}</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4"><strong>Creatore</strong></div>
                                <div class="col-md-8">

                                    <a [routerLink]="['/profile', model.creator.id ]" *ngIf="model.creator">
                                        <span class="img-avatar rounded-circle">
                                        <img src="{{ model.creator.avatar == null ? 'assets/img/avatar_64.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + model.creator.avatar }}"
                                            alt="{{ model.creator.firstname + ' ' + model.creator.lastname }}"
                                            title="{{ model.creator.firstname + ' ' + model.creator.lastname }}"
                                            width="32" class="mr-3">
                                      </span>
                                        <span class="text-dark">
                                          {{ model.creator.firstname + ' ' + model.creator.lastname }}
                                      </span>
                                    </a>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4"><strong>Data creazione</strong></div>
                                <div class="col-md-8">
                                    {{ model.createdAt | date: "dd/MM/yyyy" }}
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4"><strong>Descrizione</strong></div>
                                <div class="col-md-8">{{ model.description }}</div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4"><strong>Luogo</strong></div>
                                <div class="col-md-8">{{ model.address }}</div>
                            </div>
                             
                    <form *ngIf="model" #helpForm="ngForm" (ngSubmit)="onSubmit()">                           

                        <div class="form-row mb-3">
                            <label class="col-md-4" for="feedback"><strong>Feedback</strong></label>
                            <textarea class="col-md-8 form-control" rows="4" [(ngModel)]="model.feedback" name="feedback" required>
                        </textarea>
                        </div>

                        <div class="form-row mb-3">
                            <button class="btn btn-outline-primary offset-md-4 col-md-8 mb-3" type="submit">
                                <fa-icon [icon]="['fas', 'save']"></fa-icon> Salva
                            </button>
                        </div>
                    </form>
                        </div>
                    </div>                        
                </div>
            </div>
        </div>
    </div>
