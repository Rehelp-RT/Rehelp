<div class="card">
    <div class="card-body" *ngIf="isUserResponded || isHelpCreator">

        <h4>Risposte</h4>

        <p *ngIf="help.responses.length == 0">
            Non hai ancora ricevuto risposta da nessuno.
        </p>

        <ul class="list-group">
            <li class="list-group-item" *ngFor="let r of help.responses">
                <div>
                    <a [routerLink]="['/profile', r.responder.id ]">
                        <span class="img-avatar rounded-circle">
                                          <img src="{{ r.responder.avatar == null ? 'assets/img/avatar_64.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + r.responder.avatar }}"
                                              alt="{{ r.responder.firstname + ' ' + r.responder.lastname }}"
                                              title="{{ r.responder.firstname + ' ' + r.responder.lastname }}"
                                              width="32" class="mr-3">
                        </span>
                        <span class="text-dark">
                          {{ r.responder.firstname + ' ' + r.responder.lastname }}
                        </span>
                    </a>
                </div>
                <p>
                    {{ r.message }}
                </p>

                <fa-icon [icon]="['fas', 'check']" *ngIf="r.accepted" class="text-success"></fa-icon>
                <fa-icon [icon]="['fas', 'star-of-life']" *ngIf="r.completed" class="text-info"></fa-icon>

                <div class="text-right" *ngIf="isHelpCreator">
                    <a class="btn btn-outline-success ml-3" (click)="accept(r)" *ngIf="!r.accepted && !accepted && !completed">
                        <fa-icon [icon]="['fas', 'check']"></fa-icon> Accetta
                    </a>
                    <a class="btn btn-outline-secondary ml-3" (click)="cancel(r)" *ngIf="r.accepted && !completed">
                        Cancella
                    </a>
                    <button class="btn btn-outline-primary ml-3" (click)="openModal('modal-complete')" *ngIf="r.accepted && !completed">Completa</button>

                    <app-modal id="modal-complete">
                        <h3>Lascia un feedback e completa la richiesta</h3>
                        <hr>
                        <div class="form-row mb-3">
                            <label class="col-md-4" for="message">Messaggio</label>
                            <textarea class="col-md-8 form-control" rows="4" [(ngModel)]="message" name="message"></textarea>
                        </div>
                        <div class="form-row mb-3">
                            <label class="col-md-4" for="star-rating">Valutazione</label>
                            <div class="col-md-8">
                                <div class="row">
                                    <div class="col-sm-12">
                                        <ul class="list-inline rating-list" *ngFor="let star of stars" style="display: inline-block">
                                            <li (click)="countStar(star)" [ngClass]="{'selected': (star <= selectedValue)}">
                                                <i class="fa fa-star"></i>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="offset-md-4">
                                <a class="btn btn-lg btn-outline-primary ml-3" (click)="complete(r, message)">
                              Completa
                          </a>
                            </div>
                        </div>

                    </app-modal>
                </div>
            </li>
        </ul>
    </div>
    <div class="card-body" *ngIf="!isUserResponded && !isHelpCreator">
        <a class="btn btn-lg btn-outline-primary offset-md-3" [routerLink]="['/helps/' + help?.id + '/response/']">
            Rispondi
        </a>
    </div>
</div>
