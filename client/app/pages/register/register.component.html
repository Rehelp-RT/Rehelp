<section class="py-3">

  <div class="container">
    <div class="row">
      <div class="col-lg-4 col-md-6 offset-lg-4 offset-md-3">

        <div class="card mb-3">
          <div class="card-body">
            <h2>Iscriviti</h2>
            <hr />
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <div class="form-row mb-3">
                <input class="form-control"
                       type="text"
                       formControlName="firstname"
                       [ngClass]="{ 'is-invalid': submitted && f.firstname.errors }"
                       placeholder="Nome" />
                <div *ngIf="submitted && f.firstname.errors" class="invalid-feedback">
                  <div *ngIf="f.firstname.errors.required">
                    Il nome è obbligatorio
                  </div>
                </div>
              </div>
              <div class="form-row mb-3">
                <input class="form-control"
                       type="text"
                       formControlName="lastname"
                       [ngClass]="{ 'is-invalid': submitted && f.lastname.errors }"
                       placeholder="Cognome" />
                <div *ngIf="submitted && f.lastname.errors" class="invalid-feedback">
                  <div *ngIf="f.lastname.errors.required">
                    Il cognome è obbligatorio
                  </div>
                </div>
              </div>



              <div class="form-row mb-3">
                <input class="form-control"
                       type="text" formControlName="cf"
                       [ngClass]="{ 'is-invalid': submitted && f.cf.errors }"
                       placeholder="Codice Fiscale" />
                <div *ngIf="submitted && f.cf.errors" class="invalid-feedback">
                  <div *ngIf="f.cf.errors.required">
                    Il codice fiscale è obbligatoria
                  </div>
                  <div *ngIf="f.cf.errors?.pattern">
                    Inserire un codice fiscale valido
                  </div>
                </div>
              </div>
              <div class="form-row mb-3">
                <input class="form-control"
                       type="text" formControlName="email"
                       [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
                       placeholder="Email" />
                <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                  <div *ngIf="f.email.errors.required">
                    L'email è obbligatoria
                  </div>
                  <div *ngIf="f.email.errors?.pattern">
                    Inserire un'email valida
                  </div>
                </div>
              </div>
              <div class="form-row mb-3">
                <input class="form-control"
                       type="password"
                       formControlName="password"
                       [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
                       placeholder="Password" />
                <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                  <div *ngIf="f.password.errors.required">
                    La password è obbligatoria
                  </div>
                  <div *ngIf="f.password.errors.minlength">
                    La password deve essere almeno di 6 caratteri
                  </div>
                </div>
              </div>

              <div class="form-group">
                <button [disabled]="loading" class="btn btn-block btn-outline-secondary">
                  Registrati
                </button>
                <img *ngIf="loading"
                     class="pl-3"
                     src="data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfhYumCYUhDAQxRIdhHBGqRoKw0R8DYlJd8z0fMDgsGo/IpHI5TAAAIfkECQoAAAAsAAAAABAAEAAAAzIIunInK0rnZBTwGPNMgQwmdsNgXGJUlIWEuR5oWUIpz8pAEAMe6TwfwyYsGo/IpFKSAAAh+QQJCgAAACwAAAAAEAAQAAADMwi6IMKQORfjdOe82p4wGccc4CEuQradylesojEMBgsUc2G7sDX3lQGBMLAJibufbSlKAAAh+QQJCgAAACwAAAAAEAAQAAADMgi63P7wCRHZnFVdmgHu2nFwlWCI3WGc3TSWhUFGxTAUkGCbtgENBMJAEJsxgMLWzpEAACH5BAkKAAAALAAAAAAQABAAAAMyCLrc/jDKSatlQtScKdceCAjDII7HcQ4EMTCpyrCuUBjCYRgHVtqlAiB1YhiCnlsRkAAAOwAAAAAAAAAAAA==" />
              </div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <p>Hai già un account? <a routerLink="/login">Accedi</a></p>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
