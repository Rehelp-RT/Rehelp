<section class="py-3">
    <div class="container" *ngIf="user">

        <h2 class="display-4 mb-4">
            {{ user.firstname }} {{ user.lastname }}
        </h2>

        <div class="row">
            <div class="col-lg-3 col-md-4">
                <img src="{{ user.avatar == null ? 'assets/img/avatar_512.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + user.avatar }}" alt="{{ user.firstname + ' ' + user.lastname }}" title="{{ user.firstname + ' ' + user.lastname }}" class="img-fluid mb-3">

                <div *ngIf="user.username == currentUser?.username">
                    <a class="btn btn-block btn-outline-secondary mb-3" *ngIf="user.username == currentUser?.username" [routerLink]="['/profile/upload-avatar/', user.id]">
                        <fa-icon [icon]="['fas', 'camera']"></fa-icon> Upload
                    </a>
                </div>

                <table class="table">
                    <tr>
                        <th>Like Helps</th>
                        <td>{{ user.likehelps }} &#9733;</td>
                    </tr>
                    <tr>
                        <th>Età</th>
                        <td>{{ user.birthdate ? getAge(user.birthdate) : '-' }}</td>
                    </tr>
                    <tr>
                        <th>Località</th>
                        <td>-</td>
                    </tr>
                </table>
                <div *ngIf="user.username == currentUser?.username">
                    <a class="btn btn-block btn-outline-secondary" style="margin-top: 2%;" [routerLink]="['/profile/edit/', user.id]">
                        <fa-icon [icon]="['fas', 'pencil-alt']"></fa-icon> Modifica
                    </a>
                </div>

            </div>
            <div class="col-lg-9 col-md-8">

                <div class="card mt-3">
                    <div class="card-body">
                        <h3 class="mb-3">Richieste di aiuto</h3>

                        <div *ngIf="user.helps.length > 0">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Img</th>
                                        <th>Titolo</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let h of user.helps">
                                        <td>
                                            <img src="{{ h.image == null ? 'assets/img/placeholder-help.png' : 'http://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + h.image }}" alt="{{ h.title }} image" width="100" class="help-img">
                                        </td>
                                        <td>{{ h.title }}</td>
                                        <td>
                                            <a [routerLink]="['/helps/', h.id]" class="btn btn-sm btn-outline-secondary m-1">
                                            Dettagli
                                        </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <p *ngIf="user.helps.length == 0">Nessuna richiesta pubblicata.</p>

                        <hr>

                        <h3 class="mb-3">Offerte di aiuto</h3>

                        <p>Nessun aiuto offerto.</p>
                    </div>
                </div>

            </div>
        </div>

    </div>
</section>
