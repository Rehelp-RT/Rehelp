       <p class="forum__detail_title">Tutti i post di:  {{forumPost.author.firstname}} {{forumPost.author.lastname}}</p>

<div class="container">
    <!--Topic Section-->
    <div class="topic-container" *ngIf="forumPost" >
        <!--Original thread-->
        <div class="head">
            <div class="authors">Author : {{forumPost.author.firstname}} {{forumPost.author.lastname}}</div>
            <div class="content">Topic: {{forumPost.category.name}}</div>
        </div>

        <div class="body">
            <div class="authors">
                <div class="username"><a href="">{{forumPost.author.firstname}} {{forumPost.author.lastname}}</a></div>
                <img src="https://cdn.pixabay.com/photo/2015/11/06/13/27/ninja-1027877_960_720.jpg" alt="">
            </div>
            <div class="content">
                {{forumPost.description}}
                <div class="comment">
                    <!-- <button (click)="showComment()">Comment</button> -->
                </div>
            </div>
        </div>
        <app-comment [receivedIdHelp] = null [receivedIdPost] = "forumPost.id"></app-comment>

    </div>
