<div class="card">
    <div class="card-body">
        <div *ngFor="let message of messages">
            {{message}}
        </div>
        <hr>
        <textarea [(ngModel)]="message" (keydown.enter)="onKeyDown($event)" (keyup.enter)="sendMessage()" class="form-control mb-3"></textarea>
        <button (click)="sendMessage()" class="btn btn-outline-secondary btn-block">
            Invia
        </button>
    </div>
</div>
