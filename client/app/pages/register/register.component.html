<section class="py-3">
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2>Iscriviti</h2>
                        <hr />
                        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                            <div class="form-row mb-3">
                                <label class="col-md-4" for="firstname">Nome</label>
                                <input class="col-md-8 form-control" type="text" formControlName="firstname" [ngClass]="{ 'is-invalid': submitted && f.firstname.errors }" />
                                <div *ngIf="submitted && f.firstname.errors" class="invalid-feedback">
                                    <div *ngIf="f.firstname.errors.required">
                                        Il nome è obbligatorio
                                    </div>
                                </div>
                            </div>
                            <div class="form-row mb-3">
                                <label class="col-md-4" for="lastname">Cognome</label>
                                <input class="col-md-8 form-control" type="text" formControlName="lastname" [ngClass]="{ 'is-invalid': submitted && f.lastname.errors }" />
                                <div *ngIf="submitted && f.lastname.errors" class="invalid-feedback">
                                    <div *ngIf="f.lastname.errors.required">
                                        Il cognome è obbligatorio
                                    </div>
                                </div>
                            </div>
                            <div class="form-row mb-3">
                                <label class="col-md-4" for="email">Email</label>
                                <input class="col-md-8 form-control" type="text" formControlName="email" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
                                <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                                    <div *ngIf="f.email.errors.required">
                                        L'email è obbligatoria
                                    </div>
                                    <div *ngIf="f.email.errors?.pattern">
                                        Inserire un'email valida
                                    </div>
                                </div>
                            </div>
                            <div class="form-row mb-3">
                                <label class="col-md-4" for="password">Password</label>
                                <input class="col-md-8 form-control" type="password" formControlName="password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
                                <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                                    <div *ngIf="f.password.errors.required">
                                        La password è obbligatoria
                                    </div>
                                    <div *ngIf="f.password.errors.minlength">
                                        Password must be at least 6 characters
                                    </div>
                                </div>
                            </div>
                            <div class="form-row mb-3">
                              <label class="col-md-4">Captcha</label>
                              <re-captcha class="col-md-8" formControlName="recaptcha" (resolved)="sendTokenToBackend($event)" [ngClass]="{ 'is-invalid': submitted && f.recaptcha.errors }"></re-captcha>
                              <div *ngIf="submitted && f.recaptcha.errors" class="invalid-feedback">
                                <div *ngIf="f.recaptcha.errors.required">
                                    Non hai validato il captcha
                                </div>
                            </div>
                            </div>
                            <div class="form-group">
                                <button [disabled]="loading" class="btn btn-outline-primary">
                                    Registra
                                </button>
                                <img *ngIf="loading" class="pl-3" src="data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfhYumCYUhDAQxRIdhHBGqRoKw0R8DYlJd8z0fMDgsGo/IpHI5TAAAIfkECQoAAAAsAAAAABAAEAAAAzIIunInK0rnZBTwGPNMgQwmdsNgXGJUlIWEuR5oWUIpz8pAEAMe6TwfwyYsGo/IpFKSAAAh+QQJCgAAACwAAAAAEAAQAAADMwi6IMKQORfjdOe82p4wGccc4CEuQradylesojEMBgsUc2G7sDX3lQGBMLAJibufbSlKAAAh+QQJCgAAACwAAAAAEAAQAAADMgi63P7wCRHZnFVdmgHu2nFwlWCI3WGc3TSWhUFGxTAUkGCbtgENBMJAEJsxgMLWzpEAACH5BAkKAAAALAAAAAAQABAAAAMyCLrc/jDKSatlQtScKdceCAjDII7HcQ4EMTCpyrCuUBjCYRgHVtqlAiB1YhiCnlsRkAAAOwAAAAAAAAAAAA=="
                                />
                                <a routerLink="/login" class="btn btn-link">Annulla</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
