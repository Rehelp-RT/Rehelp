<div class="row mt-5">
  <div class="col-md-6 mx-auto">
      <h2 class="text-center">Modifica Help</h2>
      <div class="card mt-3">
          <div class="card-body">
            <form [formGroup]="helpsForm" (ngSubmit)="updateHelps(helpsForm.value)">
              <div class="form-group">
                <label class="col-md-4"> Titolo </label>
                <input type="text" class="form-control" formControlName="title" />
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn-primary col-md-4" [disabled]="helpsForm.invalid">Salva</button>
                <a [routerLink]="['/']">
                  <button type="submit" class="btn btn-primary col-md-4 ml-1">Indietro</button>
                </a>
              </div>
            </form>
          </div>
      </div>
  </div>
</div>
