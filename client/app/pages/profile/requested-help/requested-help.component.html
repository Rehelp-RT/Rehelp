<h3 class="mb-3">Richieste di aiuto</h3>

<div *ngIf="!isLoading">
    <p *ngIf="helps.length == 0">Nessun risultato trovato.</p>
    <div *ngIf="helps.length > 0">
        <div class="list-group">
            <div class="list-group-item" *ngFor="let help of helps">
                <div class="row">
                    <div class="col-md">
                        <img src="{{ getImage(help) }}" alt="{{ help.description }} image" class="help-img" width="100">
                        <!-- <img src="{{ help.image != null ? 'https://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + help.image : (help.category.image != null ? 'assets/img/categories/' + help.category.image : 'assets/img/placeholder-help.png')  }}"
                        alt="{{ help.description }} image" class="help-img" width="100"> -->
                    </div>
                    <div class="col-md">
                        <div *ngIf="help.type">
                            <app-help-type [type]="help.type"></app-help-type>
                        </div>
                        <div><app-categories [category]="help.category"></app-categories></div>
                        {{ help.description }}
                    </div>
                    <div class="col-md">
                        <div *ngIf="help.posted">
                            <fa-icon title="Postato" [icon]="['fas', 'star-of-life']" class="text-info"></fa-icon>
                            Postato
                        </div>
                        <div *ngIf="help.completed && !help.posted">
                            <fa-icon title="Completato" [icon]="['fas', 'star-of-life']" class="text-info"></fa-icon>
                            Completato
                        </div>
                        <div *ngIf="help.reviewed && !help.completed">
                            <fa-icon title="Recensito" [icon]="['fas', 'star']" class="text-warning mr-2"></fa-icon>
                            Recensito
                        </div>
                        <div *ngIf="help.accepted && !help.reviewed">
                            <fa-icon title="Accettato" [icon]="['fas', 'check']"></fa-icon>
                            Accettato
                        </div>
                        <div *ngIf="!help.accepted && !help.reviewed">
                            In accettazione
                        </div>
                    </div>
                    <div class="col-md">
                        <a [routerLink]="['/helps/', help.id]" class="btn btn-sm btn-outline-secondary m-1">
                        Dettagli
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
