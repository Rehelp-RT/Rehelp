<section class="py-3">

    <div class="container">
        <div class="row">
            <div class="col-lg-4 col-md-6 offset-lg-4 offset-md-3">
                <div class="card mb-3">
                    <div class="card-body">

                        <h2>Accedi</h2>

                        <hr>

                        <form [formGroup]="loginForm" (ngSubmit)="signInLocal()">
                            <div class="form-group">
                                <input type="text"
                                    formControlName="email"
                                    class="form-control"
                                    [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
                                    placeholder="Email" />
                                <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                                    <div *ngIf="f.email.errors.required">L'email è obbligatoria</div>
                                    <div *ngIf="f.email.errors.pattern">
                                        Inserire un'email valida
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <input type="password"
                                    formControlName="password"
                                    class="form-control"
                                    [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
                                    placeholder="Password" />
                                <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                                    <div *ngIf="f.password.errors.required">La Password è obbligatoria</div>
                                </div>
                            </div>

                            <div class="form-group">
                                <button [disabled]="loading" class="btn btn-block btn-outline-secondary">
                                    Accedi
                                </button>
                                <img *ngIf="loading" class="pl-3" src="data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfhYumCYUhDAQxRIdhHBGqRoKw0R8DYlJd8z0fMDgsGo/IpHI5TAAAIfkECQoAAAAsAAAAABAAEAAAAzIIunInK0rnZBTwGPNMgQwmdsNgXGJUlIWEuR5oWUIpz8pAEAMe6TwfwyYsGo/IpFKSAAAh+QQJCgAAACwAAAAAEAAQAAADMwi6IMKQORfjdOe82p4wGccc4CEuQradylesojEMBgsUc2G7sDX3lQGBMLAJibufbSlKAAAh+QQJCgAAACwAAAAAEAAQAAADMgi63P7wCRHZnFVdmgHu2nFwlWCI3WGc3TSWhUFGxTAUkGCbtgENBMJAEJsxgMLWzpEAACH5BAkKAAAALAAAAAAQABAAAAMyCLrc/jDKSatlQtScKdceCAjDII7HcQ4EMTCpyrCuUBjCYRgHVtqlAiB1YhiCnlsRkAAAOwAAAAAAAAAAAA=="
                                />
                            </div>

                        </form>

                        <p class="or-separator"><span>Oppure</span></p>

                        <div class="row">
                            <div class="col-md-6 mb-1">
                                <button type="button" (click)="signInWithFacebook()" class="btn btn-block btn-primary">
                                    <fa-icon [icon]="['fab', 'facebook']"></fa-icon> Facebook
                                </button>
                            </div>
                            <div class="col-md-6">
                                <button type="button" (click)="signInWithGoogle()" class="btn btn-block btn-danger">
                                    <fa-icon [icon]="['fab', 'google']"></fa-icon> Google
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <p>
                            Non hai un account?
                            <a routerLink="/register">Iscriviti</a>
                        </p>
                        <p>
                          Hai dimenticato la password?
                          <a routerLink="/password-reset">Clicca qui</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

</section>
