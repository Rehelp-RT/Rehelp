<div class="container py-3">

    <div class="card">
        <div class="card-body">
            <h3>Registrazione</h3>

            <div class="row py-3">
                <div class="col-md-8">

                    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
                        <div class="form-row" [ngClass]="{ 'has-error': invalidFirstName() }">
                            <!-- First Name -->
                            <label class="col-md-4 control-label" for="first_name">First Name</label>
                            <input class="col-md-8 form-control" type="text" id="first_name" name="first_name" placeholder="Martin" />
                            <p class="col-md-12 help-block" *ngIf="invalidFirstName()" id="first_name_error">
                                Invalid first name.
                            </p>
                        </div>

                        <div class="form-group" [ngClass]="{ 'has-error': invalidLastName() }">
                            <!-- Last Name -->
                            <label for="last_name" class="control-label">Last Name</label>
                            <input type="text" formControlName="last_name" class="form-control" id="last_name" name="last_name" placeholder="Toha" />
                            <p *ngIf="invalidLastName()" id="last_name_error" class="help-block">
                                Invalid last name.
                            </p>
                        </div>

                        <div class="form-group" [ngClass]="{ 'has-error': invalidEmail() }">
                            <!-- Email -->
                            <label for="email" class="control-label">E-mail</label>
                            <input type="text" formControlName="email" class="form-control" id="email" name="email" placeholder="your@email.com" />
                            <p *ngIf="invalidEmail()" id="email_error" class="help-block">
                                Invalid email address.
                            </p>
                        </div>

                        <div class="form-group" [ngClass]="{ 'has-error': invalidZipcode() }">
                            <!-- Zip Code-->
                            <label for="zipcode" class="control-label">Zip Code</label>
                            <input type="text" formControlName="zipcode" class="form-control" id="zipcode" name="zipcode" placeholder="#####" />
                            <p *ngIf="invalidZipcode()" id="zipcode_error" class="help-block">
                                Invalid zip code.
                            </p>
                        </div>

                        <div class="form-group" [ngClass]="{ 'has-error': invalidPassword() }">
                            <!-- Password -->
                            <label for="password" class="control-label">Password</label>
                            <input type="password" formControlName="password" class="form-control" id="password" name="password" placeholder="*****" />
                            <p *ngIf="invalidPassword()" id="password_error" class="help-block">
                                Invalid password.
                            </p>
                        </div>

                        <div class="form-group has-errore">
                            <!-- Register Button -->
                            <button type="submit" class="btn btn-primary">Register</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</div>
