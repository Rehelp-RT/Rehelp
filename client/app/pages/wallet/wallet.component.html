<div class="title">
    <h1>Wallet</h1>
</div>

<div class="subtitle">
    <h3>
        My Coin:
    </h3>
</div>

<div class="transaction" *ngFor="let i of negativeTransactions">
    <div class="all_transaction">
        <h4>TRANSAZIONE</h4>
        <p>{{i.description}}</p>
        <p>{{i.date}}</p>
        <p>{{i.likeHelp}}</p>
        <p>{{i.isPositive}}</p>
    </div>
</div>

<div class="numberTransaction">
    <p>numero di tansazioni</p>
    <p>totale coin spesi e guadagnati</p>
</div>

<div class="bottonSend">
    <p>Send coin </p>
</div>
