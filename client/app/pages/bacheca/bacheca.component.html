<div class="banner-bordi" *ngFor="let i of posts">
    <section class="banner clearfix">
        <div class="banner__image"></div>
        <div class="banner__copy">
            <div class="banner__copy__text">
                <h3> {{i.title}}</h3>
                <h4>{{i.description}}</h4>
                <p>{{i.id}} </p>
                <textarea [(ngModel)]="comment" name="" id="" cols="20" rows="2"></textarea>
                <br>
                <button (click)="post()">Comment</button>
                <p *ngFor="let comment of postComment">{{comment}}</p>
            </div>
            <div *ngFor="let comment of postComment">
                <p>{{comment}}</p>
            </div>
            <div class="accordion">
              <div class="contentBx" [class.active]="check" (click)="open()">
                <div class="label">comment</div>
                <div class="content">
                  <p>
                    welaaa deve funzionare
                  </p>
                </div>
              </div>
            </div>
        </div>
        <app-comment></app-comment>
    </section>
    
    </div>
