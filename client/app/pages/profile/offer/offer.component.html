<h3>Offerta</h3>

<hr>

<a *ngIf="isOwner" class="btn btn-outline-secondary mb-3">
    <fa-icon [icon]="['fas', 'pencil-alt']"></fa-icon>
    Modifica categorie
</a>

<p *ngIf="categories.length == 0">Nessun risultato trovato.</p>

<ul *ngIf="categories.length > 0" class="list-group">
    <li *ngFor="let cat of categories" class="list-group-item d-flex justify-content-between align-items-center">
        <app-categories [category]="cat"></app-categories>
        <span class="badge badge-primary badge-pill">14</span>
    </li>
</ul>
