<section class="py-3">

    <div class="container">
        <h4 class="display-4">Meet & Help</h4>

        <div class="text-right">
            <a [routerLink]="['/helps/add']" class="btn btn-outline-secondary mb-3">
                <fa-icon [icon]="['fas', 'plus']"></fa-icon> Aggiungi
            </a>
        </div>

        <p *ngIf="helps.length == 0">Non ci sono richieste di aiuto.</p>
        <table class="table" *ngIf="helps.length > 0">
            <thead>
                <tr>
                    <th>Richiesta</th>
                    <th>Creata</th>
                    <th>Autore</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let h of helps">
                    <td>
                        <img class="help-img" src="{{ h.image == null ? 'assets/img/placeholder-help.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + h.image }}" alt="{{ h.title }} image" width="100">

                        <div class="help-desc">
                            <p>
                                <span class="badge badge-secondary mr-1">{{ h.category?.parent?.parent?.name }}</span>
                                <span class="badge badge-secondary mr-1">{{ h.category?.parent?.name }}</span>
                                <span class="badge badge-secondary">{{ h.category?.name }}</span>
                            </p>
                            <p>{{ h.title }}</p>
                            <p>
                                <fa-icon [icon]="['fas', 'map-marker-alt']"></fa-icon>
                                {{ h.address }}
                            </p>
                        </div>
                    </td>
                    <td>
                        {{ h.createdAt | date: "dd/MM/yyyy" }}
                    </td>
                    <td>
                        <span class="img-avatar rounded-circle">
                          <img src="{{ h.creator.avatar == null ? 'assets/img/avatar_64.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + h.creator.avatar }}" alt="{{ h.creator.firstname + ' ' + h.creator.lastname }}" title="{{ h.creator.firstname + ' ' + h.creator.lastname }}" width="32">
                        </span>
                    </td>
                    <td>
                        <a [routerLink]="['/helps/', h.id]" class="btn btn-block btn-sm btn-outline-primary m-1">
                            Dettagli
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
