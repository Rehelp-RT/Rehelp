<section class="py-3">
    <div class="container">
        <h2 class="display-4 mb-4">Meet &amp; Help</h2>
        <app-alert></app-alert>
        <div class="row">
            <div class="col-md-6 text-center">
                <a [routerLink]="['/helps']">
                    <img alt="Trova aiuto" src="assets/img/find-help.jpg" class="img-fluid mb-3">
                    <h3 class="text-dark">Cerca qualcuno da aiutare</h3>
                </a>
            </div>
            <div class="col-md-6 text-center">
                <div *ngIf="likeHelpController()">
                    <a [routerLink]="['/helps/add']">
                        <img alt="Trova aiuto" src="assets/img/post-help.jpg" class="img-fluid mb-3">
                        <h3 class="text-dark">Pubblica una richiesta d'aiuto</h3>
                    </a>
                </div>
                <div *ngIf="!likeHelpController()">
                    <a (click)="alertService.error('Siamo spiacenti, non puoi pubblicare una richiesta di aiuto perché sei a corto di LikeHelps! Aiuta qualcuno per recuperarli.', options)">
                        <img alt="Trova aiuto" src="assets/img/post-help.jpg" class="img-fluid mb-3">
                        <h3 class="text-dark">Pubblica una richiesta d'aiuto</h3>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
