<a [routerLink]="['/profile', user.id ]" class="avatar">
    <span class="img-avatar rounded-circle">
        <img src="{{ getAvatar() }}"
            alt="{{ getFullname() }}"
            title="{{ getFullname() }}"
            width="32" class="mr-3">
    </span>
    <span class="txt-avatar text-dark" *ngIf="showName">
        {{ getFullname() }}
    </span>
</a>
