<section class="py-3">
    <div class="container" *ngIf="user">

        <div class="row">

            <div class="col-lg-4 col-md-6">

                <figure class="overlay-wrapper rounded-circle mb-3">
                    <img class="img-flud" src="{{ user.avatar == null ? 'assets/img/avatar_512.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + user.avatar }}" alt="{{ user.firstname + ' ' + user.lastname }}" title="{{ user.firstname + ' ' + user.lastname }}">
                    <figcaption *ngIf="user.username == currentUser?.username" class="overlay-panel overlay-black text-center">
                        <a class="btn btn-lg btn-outline-secondary btn-circle mb-3" [routerLink]="['/profile/upload-avatar/', user.id]">
                            <fa-icon [icon]="['fas', 'camera']" size="lg"></fa-icon>
                        </a>
                    </figcaption>
                </figure>

                <h2 class="mb-3">
                    {{ user.firstname }} {{ user.lastname }}
                </h2>

                <p class="text-dark mb-3">
                    <fa-icon [icon]="['fas', 'map-marker-alt']"></fa-icon>
                    {{ user.address }}
                </p>

                <table class="table">
                    <tr>
                        <th>Like Helps</th>
                        <td>
                            {{ user.likehelps }}
                            <fa-icon [icon]="['fas', 'star-of-life']"></fa-icon>
                        </td>
                    </tr>
                    <tr>
                        <th>Età</th>
                        <td>{{ user.birthdate ? getAge(user.birthdate) : '-' }}</td>
                    </tr>
                </table>

                <div class="text-right" *ngIf="user.username == currentUser?.username">
                    <a class="btn btn-outline-secondary btn-circle" title="Modifica" [routerLink]="['/profile/edit/', user.id]">
                        <fa-icon [icon]="['fas', 'pencil-alt']"></fa-icon>
                    </a>
                </div>

            </div>

            <div class="col-lg-8 col-md-6">

                <div class="card mt-3">
                    <div class="card-body">
                        <h3 class="mb-3">Richieste di aiuto</h3>

                        <div *ngIf="user.helps.length > 0">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Img</th>
                                        <th>Titolo</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let h of user.helps">
                                        <td>
                                            <img src="{{ h.image == null ? 'assets/img/placeholder-help.png' : 'http://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + h.image }}" alt="{{ h.title }} image" width="100" class="help-img">
                                        </td>
                                        <td>{{ h.title }}</td>
                                        <td>
                                            <a [routerLink]="['/helps/', h.id]" class="btn btn-sm btn-outline-secondary m-1">
                                            Dettagli
                                        </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <p *ngIf="user.helps.length == 0">Nessuna richiesta pubblicata.</p>

                        <hr>

                        <h3 class="mb-3">Offerte di aiuto</h3>

                        <p>Nessun aiuto offerto.</p>
                    </div>
                </div>

                <fa-icon [icon]="['fas', 'coffee']" size="xs"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="sm"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="md"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="lg"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="2x"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="3x"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="4x"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="5x"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" size="6x"></fa-icon>

                <fa-icon [icon]="['fas', 'coffee']" pull="left"></fa-icon>
                <fa-icon [icon]="['fas', 'coffee']" pull="right"></fa-icon>

                <div>
                    <fa-icon [icon]="['fas', 'sync']" [spin]="isSyncAnimated" (click)="isSyncAnimated=!isSyncAnimated"></fa-icon>
                </div>
                <div>
                    <fa-stack>
                        <fa-icon [icon]="['fas', 'circle']" stackItemSize="2x"></fa-icon>
                        <fa-icon [icon]="['fas', 'pencil-alt']" [inverse]="true" stackItemSize="1x"></fa-icon>
                    </fa-stack>
                </div>
                <div>
                    <fa-layers [fixedWidth]="true">
                        <fa-icon [icon]="['fas', 'square']"></fa-icon>
                        <fa-icon [inverse]="true" [icon]="['fas', 'spinner']" transform="shrink-6"></fa-icon>
                    </fa-layers>
                </div>
                <div>
                    <fa-layers [fixedWidth]="true">
                        <fa-icon [icon]="['fas', 'square']"></fa-icon>
                        <fa-layers-text content="Yo" style="color: white;" transform="shrink-4"></fa-layers-text>
                    </fa-layers>
                </div>

            </div>

        </div>

    </div>
</section>
