<a [routerLink]="['/profile', user.id ]" class="flex-container avatar">
    <span class="flex-item">
        <span class="img-avatar rounded-circle">
            <img src="{{ getAvatar() }}"
                alt="{{ getFullname() }}"
                title="{{ getFullname() }}"
                width="32">
        </span>
    </span>
    <span class="flex-item txt-avatar" *ngIf="showName || showAge || showRating">
        <span *ngIf="showName" class="text-dark">{{ getFullname() }}</span>
        <span *ngIf="showAge" class="text-secondary"><br>({{ getAge() }} anni)</span>
        <span *ngIf="showRating">
            <br><span class="mr-3">{{ getRating(user) | number:'1.0-1' }}</span>
            <span *ngFor="let rat of [1,2,3,4,5] | slice:0:getRating(user)">
                <fa-icon title="Recensito" [icon]="['fas', 'star']" class="text-warning mr-2"></fa-icon>
            </span>
        </span>
    </span>
</a>
<div class="clearfix"></div>
