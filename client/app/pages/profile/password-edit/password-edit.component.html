<h3>Modifica password</h3>

<hr>

<form [formGroup]="passwordEditForm" (ngSubmit)="onSubmit()">

    <div class="form-row mb-3">
        <label class="col-md-4" for="password">Nuova password</label>
        <input class="col-md-8 form-control" type="password" formControlName="password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
        <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
            <div *ngIf="f.password.errors.required">La password è obbligatoria</div>
            <div *ngIf="f.password.errors.minlength">La password deve essere almeno di 6 caratteri</div>
        </div>
    </div>
    <div class="form-row mb-3">
        <label class="col-md-4">Conferma password</label>
        <input class="col-md-8 form-control" type="password" formControlName="confirmPassword" [ngClass]="{ 'is-invalid': submitted && f.confirmPassword.errors }" />
        <div *ngIf="submitted && f.confirmPassword.errors" class="invalid-feedback">
            <div *ngIf="f.confirmPassword.errors.required">Conferma password è obbligatoria</div>
            <div *ngIf="f.confirmPassword.errors.mustMatch">Le password devono coincidere</div>
        </div>
    </div>

    <div class="form-row mb-3" *ngIf="model">
        <div class="offset-md-4 col-md-4 mb-1">
            <a class="btn btn-block btn-outline-secondary" [routerLink]="['/profile', model.id ]">Annulla</a>
        </div>
        <div class="col-md-4">
            <button class="btn btn-block btn-outline-primary" type="submit">
                <fa-icon [icon]="['fas', 'save']"></fa-icon> Salva
            </button>
        </div>
    </div>
</form>
