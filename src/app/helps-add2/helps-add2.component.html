<div class="container py-3">
    <div class="row">

        <div class="col-lg-2 col-md-3 mb-3">
            <a class="btn btn-block btn-outline-secondary" [routerLink]="['/helps']">
                <fa-icon [icon]="['fas', 'chevron-left']"></fa-icon> Aiuti
            </a>
        </div>

        <div class="col-lg-10 col-md-9">

            <h2 class="display-4">Meet & Help</h2>
            <div class="card my-3">
                <div class="card-body">
                    <form #helpForm="ngForm" (ngSubmit)="onSubmit()">

                        <input type="hidden" [(ngModel)]="model.idCreator" name="idCreator">
                        <input type="hidden" [(ngModel)]="model.idType" name="idType">

                        <div class="form-row mb-3">
                            <label class="col-md-3" for="title">Titolo</label>
                            <input class="col-md-9 form-control" type="text" [(ngModel)]="model.title" name="title" required />
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-md-3" for="category">Categoria</label>
                            <select class="col-md-9 form-control" [(ngModel)]="model.idCategory" name="idCategory" required>
                              <option *ngFor="let cat of categories" [value]="cat.id">
                                  {{ cat.name }}
                              </option>
                          </select>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-md-3" for="description">Descrizione</label>
                            <textarea class="col-md-9 form-control" rows="4" [(ngModel)]="model.description" name="description" required>
                          </textarea>
                        </div>

                        <div class="form-row mb-3">
                            <label class="col-md-3" for="location">Zona</label>
                            <div class="col-md-9">
                                <agm-map [(latitude)]="location.lat" [(longitude)]="location.lng" [(zoom)]="location.zoom" [disableDefaultUI]="true" [zoomControl]="true" [(fitBounds)]='location.viewport'>
                                    <agm-marker [(latitude)]="location.marker.lat" [(longitude)]="location.marker.lng" [markerDraggable]="location.marker.draggable" (dragEnd)='markerDragEnd($event)'></agm-marker>
                                </agm-map>

                                <input type="hidden" [(ngModel)]="model.latitude" name="latitude" value="{{latitude}}">
                                <input type="hidden" [(ngModel)]="model.longitude" name="longitude" value="{{longitude}}">
                            </div>
                        </div>


                        <div class="form-row">
                            <label class='col-sm-2'>Address Line 1</label>
                            <input class='col-sm-10' type='text' [(ngModel)]='location.address_level_1' class="form-control" placeholder='Office, Apt, Home, Street'>
                        </div>
                        <div class="form-row">
                            <label class='col-sm-2'>Address Line 2</label>
                            <input class='col-sm-10' [(ngModel)]='location.address_level_2' class='form-control' placeholder='City' />
                        </div>

                        <div class="form-row">
                            <label class='col-sm-2'>State / Province / Region</label>
                            <input class='col-sm-10' [(ngModel)]='location.address_state' class='form-control' placeholder='State'>
                        </div>

                        <div class="form-row">
                            <label class='col-sm-2'>Country</label>
                            <input class='col-sm-10' [(ngModel)]='location.address_country' class='form-control' placeholder='State'>
                        </div>

                        <div class="form-row">
                            <label class='col-sm-2'>Postal / Zip code</label>
                            <input class='col-sm-10' [(ngModel)]='location.address_zip' class='form-control' placeholder='Zip'>
                        </div>



                        <div class="form-row mb-3">
                            <label class="col-md-3" for="address">Indirizzo</label>
                            <input type="text" class="col-md-9 form-control" [(ngModel)]="model.address" name="address" (keydown.enter)="$event.preventDefault()" placeholder="{{address}}" autocorrect="off" autocapitalize="off" spellcheck="off" type="text" #search>
                        </div>

                        <div class="form-row mb-3">
                            <button class="btn btn-outline-primary offset-md-3 col-md-9 mb-3" type="submit">
                              <fa-icon [icon]="['fas', 'plus']"></fa-icon> Aggiungi
                          </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>

    </div>
</div>
