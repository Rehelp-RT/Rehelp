<div class="modal-header">
    <h4 class="modal-title">Modifica categorie</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">

    <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="checkbox m-0 p-0" formArrayName="categories" *ngFor="let category of form.controls.categories.controls; let i = index">
            <label>
                <input class="mr-3" type="checkbox" [formControlName]="i" [checked]="categoriesData[i].checked">
                <app-categories [category]="categoriesData[i]"></app-categories>
            </label>
        </div>

        <p class="alert alert-warning" role="alert" *ngIf="!form.valid">
            Seleziona almeno una categoria.
        </p>

        <hr>

        <button class="btn btn-lg btn-outline-primary" [disabled]="!form.valid">Salva</button>

    </form>

</div>
