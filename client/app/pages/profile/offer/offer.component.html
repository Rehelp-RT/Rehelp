<div class="row">

    <div class="col-md-6">
        <h3>Offerta</h3>
    </div>

    <div class="col-md-6 text-right" *ngIf="isOwner">
        <button class="btn btn-outline-secondary mb-3" (click)="openModal(mymodal)">
            <fa-icon [icon]="['fas', 'pencil-alt']"></fa-icon>
            Modifica
        </button>
    </div>

</div>

<fa-icon [icon]="['fas', 'sync']" [spin]="isLoading" *ngIf="isLoading"></fa-icon>

<div *ngIf="!isLoading">
    <p *ngIf="categories.length == 0">Nessun risultato trovato.</p>
    
    <span *ngFor="let cat of categories">
        <app-categories [category]="cat"></app-categories>
    </span>
</div>



<ng-template #mymodal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">Modifica categorie</h4>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="checkbox m-0 p-0" formArrayName="categories" *ngFor="let category of getFormCategories(); let i = index">
                <label>
                    <input class="mr-3" type="checkbox" [formControlName]="i" [checked]="categoriesData[i].checked">
                    <app-categories [category]="categoriesData[i]"></app-categories>
                </label>
            </div>
    
            <p class="alert alert-warning" role="alert" *ngIf="!form.valid">
                Seleziona almeno una categoria.
            </p>
    
            <hr>
    
            <button class="btn btn-lg btn-outline-primary" [disabled]="!form.valid">Salva</button>
    
        </form>
    </div>
</ng-template>
