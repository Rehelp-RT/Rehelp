<div class="" *ngFor="let i of posts">
    <section class="banner clearfix">
        <div class="banner__image">
            <img src="{{ i.image != null ? 'https://res.cloudinary.com/hwbyvepex/image/upload/v1582196512/' + i.image : (i.help.category.image != null ? 'assets/img/categories/' + i.help.category.image : 'assets/img/placeholder-help.png')  }}"
                                alt="{{ i.help.description}} image" class="banner_image_size">
        </div>
        <div class="banner__copy">
            <div class="banner__copy__text">
              <div class="banner__copy__text__header">
                <p>
                  {{i.help.category.name}}
                </p>
                <p>
                  {{getDate(i.createdAt)}}
                </p>
              </div>
              <div class="banner__copy__text__description">
                <p>
                  {{i.description}}
                </p>
              </div>
              <div class="banner__copy__text__footer">
                <p>
                  {{i.author.firstname}}
                </p>
                <p>
                  {{i.responder.firstname}}
                </p>
              </div>
               <!-- <p> categoria: {{i.help.category.name}}</p>
                <p> descrizione: {{i.help.description}}</p>
                <p> creator help: {{i.creator.firstname}} </p>
                <p> feedback del creator: {{i.messageCreator}}</p>
                <p> stelle feedback del creator: {{i.ratingCreator}}</p>
                <p> immagine feedback del creator: {{i.imageReviewCreator}} </p>
                <p> data feedback del creator: {{getDate(i.creatorReviewedAt)}} </p>
                <p> responder: {{i.responder.firstname}}</p>
                <p> feedback del responder: {{i.messageResponder}}</p>
                <p> stelle feedback del responder: {{i.ratingResponder}} </p>
                <p> immagine feedback del responder: {{i.imageReviewResponder}}</p>
                <p> data feedback del responder: {{getDate(i.responderReviewedAt)}} </p>-->
                
               <!-- <p *ngFor="let comment of postComment">{{comment}}</p>-->
            </div>
           <!-- <div *ngFor="let comment of postComment">

            </div>-->
