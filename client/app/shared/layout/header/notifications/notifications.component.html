<div class="dropdown" [ngClass]="{'show': isOpen}">
    <li class="dropdown-toggle" (click)="isOpen = !isOpen" role="button" id="dropdownMenuLink"
        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <fa-layers [fixedWidth]="true" size="2x" class="header-icon">
            <fa-icon [icon]="['fas', 'bell']"></fa-icon>
            <fa-layers-counter content="{{notifications.length}}" size="2x" class="fa-icon-counter">
            </fa-layers-counter>
        </fa-layers>
    </li>

    <div class="dropdown-menu" [ngClass]="{'show': isOpen}" aria-labelledby="dropdownMenuLink">
        <li class="nav-item" *ngFor="let n of notifications">
            <span class="nav-link" (click)="navigate(n.idHelp)">
                {{ n.message}}
            </span>
            <span *ngIf="!n.checked" (click)="checkNotification(n)">
                <fa-icon [icon]="['fas', 'circle']"></fa-icon>
            </span>
            <span *ngIf="n.checked">
                <fa-icon [icon]="['far', 'circle']"></fa-icon>
            </span>
        </li>
    </div>
</div>
