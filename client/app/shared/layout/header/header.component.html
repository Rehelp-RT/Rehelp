<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <button aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-target="#navbarMain" data-toggle="collapse" type="button" (click)="toggleNavbar()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" [routerLink]="['/']">
                <img alt="ReHelp" src="assets/img/logo-rehelp.png" width="200">
            </a>
            <div class="collapse navbar-collapse" id="navbarMain" [ngClass]="{ 'show': navbarOpen }">
                <ul class="nav navbar-nav">
                    <li class="nav-item" *ngIf="currentUser" routerLinkActive="active">
                        <a class="nav-link" routerLink="/helps">Richieste</a>
                    </li>
                    <li class="nav-item" *ngIf="currentUser" routerLinkActive="active">
                        <a class="nav-link" routerLink="/users">Offerte</a>
                    </li>
                </ul>
                <ul class="nav navbar-nav ml-auto">
                    <li class="nav-item" *ngIf="!currentUser" routerLinkActive="active">
                        <a class="nav-link btn btn-outline-secondary" routerLink="/login">Accedi</a>
                    </li>
                    <app-notifications [currentUser]="currentUser"></app-notifications>

                    <li class="nav-item" *ngIf="currentUser">
                        <a class="nav-link" routerLink="/profile/{{ currentUser.id }}">
                            <span class="img-avatar rounded-circle">
                                <img src="{{ currentUser.avatar == null ? 'assets/img/avatar_64.png' : 'https://res.cloudinary.com/hwbyvepex/image/upload/' + currentUser.avatar }}"
                                    alt="{{ currentUser.firstname + ' ' + currentUser.lastname }}"
                                    alt="{{ currentUser.firstname + ' ' + currentUser.lastname }}"
                                    title="{{ currentUser.firstname + ' ' + currentUser.lastname }}" width="32">
                            </span>
                        </a>
                    </li>
                    <li class="nav-item" *ngIf="currentUser">
                        <button class="btn btn-outline-secondary" (click)="logout()">Esci</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
