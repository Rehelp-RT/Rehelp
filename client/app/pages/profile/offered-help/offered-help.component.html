<h3 class="mb-3">Offerte di aiuto</h3>

<div *ngIf="!isLoading">
    <p *ngIf="responses.length == 0">Nessun risultato trovato.</p>
    <div *ngIf="responses.length > 0">
        <div class="list-group">
            <div class="list-group-item" *ngFor="let r of responses">
                <div class="row">
                    <div class="col-md">
                        <img src="{{ getImage(r.help) }}" alt="{{ r.help.description }} image" class="help-img" width="100">
                    </div>
                    <div class="col-md">
                        <div *ngIf="r.help.type">
                            <app-help-type [type]="r.help.type"></app-help-type>
                        </div>
                        <div><app-categories [category]="r.help.category"></app-categories></div>
                        {{ r.help.description }}
                    </div>
                    <div class="col-md">
                        <div *ngIf="!r.help.accepted">
                            In accettazione
                        </div>
                        <div *ngIf="r.help.accepted && !r.help.reviewed">
                            <fa-icon title="Accettato" [icon]="['fas', 'check']"></fa-icon>
                        </div>
                        <div *ngIf="r.help.reviewed && !r.help.completed">
                            <fa-icon title="Recensito" [icon]="['fas', 'star']" class="text-warning mr-2"></fa-icon>
                        </div>
                        <div *ngIf="r.help.completed">
                            <fa-icon title="Completato" [icon]="['fas', 'star-of-life']" class="text-info"></fa-icon>
                        </div>
                    </div>
                    <div class="col-md">
                        <a [routerLink]="['/helps/', r.help.id]" class="btn btn-sm btn-outline-secondary m-1">
                            Dettagli
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
